# Config for: ortla lookup
# Look up expected trips for one station pair across the period matrices.
#
# Copy this file into configs/ (which is gitignored) and fill in your own
# data source paths before running (run `loading` first):
#   ortla lookup configs/lookup.yml
output_path: "outputs/loading"

# Set true if the period matrices were built with loading's hourly mode, so the
# day x hour grid is ordered by clock hour.
# hourly: true

period_matrices_dir: "outputs/loading/northern_period_matrices"
origin: LIV
destination: MAN

# Show expected trips on a typical day of each type instead of annual totals.
per_day: true
fill_value: "!"

day_order:
  - Monday
  - Tuesday
  - Wednesday
  - Thursday
  - Friday
  - Saturday
  - Sunday
period_order:
  - early
  - am_peak
  - interpeak
  - pm_peak
  - evening

# Set to true to also classify the O->D pair by track-distance band. This
# requires the `distance` and `route_type` blocks below (and is slower, as
# it builds the routing graph).
journey_type: false
route_type:
  bands:
    commute: 30
    regional: 100
  fallback: long_distance

