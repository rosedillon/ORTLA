# Config for: ortla bplan
# Clean a Network Rail BPLAN Geography extract (LOC/NWK/TLK/TLD/PLT/REF
# records, tab-delimited) and build the minimum-sectional-running-time graph.
#
# Writes bplan_locations.csv, bplan_network_links.csv, bplan_timing_links.csv
# and bplan_traction_loads.csv to output_path; the `propose` command reads
# bplan_timing_links.csv back via BplanTimingGraph.
#
# Copy this file into configs/ (which is gitignored) and fill in your own
# data source paths before running:
#   ortla bplan configs/bplan.yml
output_path: "outputs/bplan"

geography_path: "/path/to/datasources/bplan-geography-extract.txt"
