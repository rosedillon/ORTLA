# Config for: ortla matrix
# Build the annual origin-destination matrix from the source ODM.
#
# Copy this file into configs/ (which is gitignored) and fill in your own
# data source paths before running:
#   ortla matrix configs/matrix.yml
output_path: "outputs/loading"

source_odm: "/path/to/datasources/ODM_for_RDM_2024-25.csv"
valid_stations: "/path/to/datasources/valid_stations.csv"

chunk_size: 500000
keep_columns:
  - origin_tlc
  - destination_tlc
  - journeys
fill_value: "!"
